name: Magpie Watchdog

concurrency:
  group: magpie-watchdog
  cancel-in-progress: false

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  run-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run watchdog
        env:
          CLIENT_SERVER: ${{ secrets.CLIENT_SERVER }}
          DISPATCH_SERVER: ${{ secrets.DISPATCH_SERVER }}
          BOT_KEY: ${{ secrets.BOT_KEY }}
          DELAY_MS: ${{ secrets.DELAY_MS }}
          FAILURE_RATE_ABORT_THRESHOLD: ${{ secrets.FAILURE_RATE_ABORT_THRESHOLD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node run.mjs
